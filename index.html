<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>응용데이터분석 (ADA) 교재</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="응용데이터분석 강의 교재 — GitHub 기반 온라인 교재" />

  <!-- KaTeX 수식 렌더링용 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />

  <!-- Docsify 기본 테마 (vue 테마, 사이드바 포함) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />

  <style>
    :root {
      --theme-color: #2f6feb;
    }
    body { -webkit-font-smoothing: antialiased; }
    .markdown-section { max-width: 900px; }
    .markdown-section img { border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    .markdown-section code { background: #f3f3f3; }
  </style>
</head>
<body>
  <div id="app">로딩 중...</div>

  <script>
    window.$docsify = {
      name: '응용데이터분석 (ADA) 교재',
      repo: 'https://github.com/skku-ada/26h2',
      loadSidebar: true,          // _sidebar.md 를 목차로 사용
      loadNavbar: false,
      subMaxLevel: 2,             // 사이드바에 ##, ### 제목까지 자동 표시
      auto2top: true,             // 페이지 이동 시 맨 위로 스크롤
      homepage: 'README.md',      // "/" 경로에서 보여줄 첫 화면
      coverpage: false,
      alias: {
        // 장 폴더 하위 어디서든 같은 사이드바를 쓰게 함
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '교재 내용 검색...',
        noData: '검색 결과가 없습니다.',
        depth: 4
      },
      copyCode: {
        buttonText: '복사',
        errorText: '실패',
        successText: '복사됨'
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      }
    };
  </script>

  <!--
    수식(LaTeX) 렌더링: docsify-katex는 markdown이 파싱되기 전에
    $...$ / $$...$$ 구간을 미리 떼어내 보호해야 하므로,
    반드시 docsify 본체(아래)보다 "먼저" 로드해야 합니다.
    (순서를 바꾸면 마크다운의 _ 기호가 수식 안 아래첨자를
    이탤릭체로 잘못 해석해버립니다 — 이번에 실제로 겪은 문제.)
  -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@1.4.3/dist/docsify-katex.js"></script>

  <!-- Docsify 본체 (빌드 과정 없이 CDN 스크립트만으로 동작) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- 검색 플러그인 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- 코드블록 복사 버튼 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- 이전/다음 페이지 네비게이션 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <!-- 이미지 클릭 시 확대 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-image-zoom@0.2.0/dist/zoom.min.js"></script>
</body>
</html>
